<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" fill="none" role="img" aria-label="Julian Codespoti, Software Engineer in Melbourne">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="880" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="880" height="176" rx="12" fill="url(#bg-light)"/>
  <rect width="880" height="176" rx="12" fill="url(#grid-light)" opacity="0.75"/>
  <rect x="0.5" y="0.5" width="879" height="175" rx="11.5" stroke="#CBD5E1"/>

  <rect x="40" y="36" width="40" height="3" rx="1.5" fill="url(#accent-light)"/>

  <text x="40" y="76" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">
    Julian Codespoti
  </text>

  <text x="40" y="106" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
    Software Engineer @ Arinco  ·  Melbourne
  </text>

  <text x="40" y="138" fill="#64748B" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
    C# / .NET  ·  Rust  ·  TypeScript  ·  Azure
  </text>
